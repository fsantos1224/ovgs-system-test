services:
  api:
    build:
      context: .
      target: api
    ports:
      - "3001:3001"
    volumes:
      - api-data:/app/data
    environment:
      - CORS_ORIGINS=http://localhost:8080

  frontend:
    build:
      context: .
      target: frontend
    ports:
      - "8080:80"
    depends_on:
      - api

volumes:
  api-data:
