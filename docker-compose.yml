services:
  api:
    image: node:20-alpine
    working_dir: /app
    volumes:
      - .:/app
      - ovgs-data:/app/data
    command: node server.cjs
    environment:
      - NODE_ENV=production
    ports:
      - "3001:3001"

  frontend:
    build: .
    ports:
      - "8080:80"
    depends_on:
      - api

volumes:
  ovgs-data: